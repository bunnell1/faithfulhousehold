<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" role="img" aria-label="Faithful Household">
  <rect width="80" height="80" rx="18" fill="#2f4a38"/>
  <!-- open book: layered pages fanning from a center spine -->
  <!-- bottom page edges -->
  <path fill="#d9d0bc" d="M10 56 Q25 50 40 52 Q55 50 70 56 Q55 62 40 60 Q25 62 10 56Z"/>
  <path fill="#e4dcc8" d="M11 52 Q26 46 40 48 Q54 46 69 52 Q54 58 40 56 Q26 58 11 52Z"/>
  <path fill="#efe8d8" d="M12 48 Q27 42 40 44 Q53 42 68 48 Q53 54 40 52 Q27 54 12 48Z"/>
  <!-- top open pages -->
  <path fill="#f3eee4" d="M13 44 Q28 36 40 38 Q52 36 67 44 L40 50 L13 44Z"/>
  <path fill="#f3eee4" d="M67 44 Q52 36 40 38 Q28 36 13 44 L40 50 L67 44Z"/>
  <!-- center spine -->
  <path fill="#c9c0ac" d="M39.2 38 L40.8 38 L40.8 58 L39.2 58Z"/>
  <!-- copper house rising from the open pages -->
  <path fill="#8d4e2b" d="M40 14 L20 30 H24 V46 H56 V30 H60 Z"/>
  <!-- Christian cross window -->
  <rect x="37.2" y="28" width="5.6" height="13" rx="0.5" fill="#f3eee4"/>
