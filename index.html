<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grace & Truth Steward</title>
  <meta name="description" content="A stewardship planning aid. Giving first, then what is owed, then a reserve, then living. Numbers stay on your device.">
  <meta name="theme-color" content="#2f4a38">
  <link rel="icon" href="mark.png" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>
  <div class="wrap">
    <header>
      <button type="button" class="brand" id="nav-mark">
        <span class="mark" aria-hidden="true"><img src="mark.png" alt=""></span>
        <span>
          <span class="display word">Grace & Truth</span>
          <span class="display word">Steward</span>
          <span class="rule" aria-hidden="true"></span>
        </span>
      </button>
      <nav class="no-print" aria-label="Site">
        <button type="button" id="nav-home">Home</button>
        <button type="button" id="nav-plan">Plan</button>
        <button type="button" id="nav-about">About</button>
      </nav>
    </header>

    <div id="view-home">
      <div style="text-align:center;">
        <img src="logo.png" alt="Grace & Truth Steward" class="hero-logo">
      </div>
      <p class="eyebrow">A stewardship planning aid</p>
      <h1>Give first. Then keep the house in order.</h1>
